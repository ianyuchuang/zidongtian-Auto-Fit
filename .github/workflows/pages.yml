# 把 web/ 發布到 GitHub Pages（純前端，無建置步驟）。
# 網址：https://ianyuchuang.github.io/zidongtian-Auto-Fit/
# 前提：repo 為公開，且 Settings → Pages → Source 選「GitHub Actions」。說明見 docs/部署.md。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
